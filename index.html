<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QRコードバトラー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one portrait "scanner device" column — status bar on top, the active view in the middle, a 4-tab dock at the bottom; overlays slide over it. */
:root{
  --ink:#0C1F27;          /* device body / page ground */
  --panel:#13303B;        /* raised panels */
  --line:#24505E;         /* dot-matrix grid & hairlines */
  --paper:#F4F1E8;        /* card stock */
  --paper-ink:#1D1A33;    /* text on paper */
  --coral:#FF7A59;        /* primary action */
  --gold:#FFC83D;         /* QR coin */
  --mint:#5ED6B0;         /* good / you */
  --rose:#FF5C7A;         /* bad / opponent */
  --muted:#8FB2BC;
  --display:"DotGothic16","M PLUS Rounded 1c",ui-monospace,monospace;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:14px 14px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(12,31,39,.6),rgba(12,31,39,.95));box-shadow:0 0 0 1px var(--line)}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.namechip{display:flex;flex-direction:column;align-items:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 12px;min-width:0;max-width:52%}
.namechip small{font-size:10px;color:var(--muted);letter-spacing:.08em}.namechip small span{color:var(--gold);font-weight:800}
.namechip b{font:800 15px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.namechip b::after{content:' ✎';font-size:11px;color:var(--muted)}
.coin{display:flex;align-items:center;gap:6px;background:#0A1A20;border:2px solid var(--gold);border-radius:99px;padding:4px 10px 4px 5px;min-width:0}.coin.gold{margin-left:auto}.coin.qp{border-color:var(--mint)}.coin.qp b{color:var(--mint)}.coin.qp i{background-color:var(--mint)}
.coin.gold.bump,.coin.qp.bump{animation:cbump .25s}@keyframes cbump{40%{transform:scale(1.12)}}
.gc{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF1B0,#FFC83D 55%,#C9900F);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);flex:none}
.coin i,.ci{display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--mint);position:relative;flex:none;
  background-image:linear-gradient(var(--paper-ink),var(--paper-ink)),linear-gradient(var(--paper-ink),var(--paper-ink)),linear-gradient(var(--paper-ink),var(--paper-ink));
  background-size:6px 6px;background-position:3px 3px,11px 3px,3px 11px;background-repeat:no-repeat}
.coin b{font:400 16px var(--display);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.namechip{max-width:36%}
.gear{width:38px;height:38px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:18px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.dock{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#0A1A20;padding-bottom:env(safe-area-inset-bottom,0px)}
.dock button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:800 12px var(--body)}
.dock button canvas{width:28px;height:28px}
.dock button.on{color:var(--gold)}
.dock button.on canvas{filter:drop-shadow(0 0 6px rgba(255,200,61,.6))}
h2{margin:0;font:400 22px var(--display);letter-spacing:.04em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.btn{border:0;border-radius:14px;padding:12px 18px;font:800 16px var(--body);background:var(--coral);color:var(--paper-ink);box-shadow:0 4px 0 #A8402A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A8402A}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #B68714}
.btn.ghost{background:var(--panel);color:var(--paper);box-shadow:0 4px 0 #071318;border:2px solid var(--line)}
.btn small{display:block;font-size:11px;font-weight:800;opacity:.8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px}
.toast.btm{font:400 18px var(--display);padding:10px 18px;border:3px solid var(--paper-ink)}.toast.btm.w{background:#DDF7EC;color:#146B45}.toast.btm.l{background:#FFE1E6;color:#A3243B}.toast.btm.d{background:#ECE8DD}.toast.btm.vd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 22px}.toast.btm.vd b{font:400 30px/1.1 var(--display);letter-spacing:.06em}.toast.btm.vd small{font:800 14px var(--body)}.toast.btm.vd em{font:400 22px var(--display);font-style:normal;padding:0 2px}
.card.win{filter:drop-shadow(0 0 10px #FFC83D);transform:scale(1.12);transition:transform .2s}.card.lose{opacity:.55;transform:scale(.92);transition:transform .2s,opacity .2s}
.toast.btm.vd.bet{background:linear-gradient(160deg,#FFE680,#FFC83D 45%,#E89A10);color:#4A2C00;border-color:#4A2C00;overflow:hidden;animation:betIn .45s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 0 0 3px rgba(255,200,61,.35),0 8px 24px rgba(0,0,0,.5)}
.toast.btm.vd.bet b{font-size:38px;letter-spacing:.12em;text-shadow:2px 2px 0 #FFF3B0,-1px -1px 0 #A86A00}.toast.btm.vd.bet small{display:flex;align-items:center;gap:5px}.toast.btm.vd.bet .ci{width:18px;height:18px}.toast.btm.vd.bet em{color:#1F6B3A}
.toast.btm.vd.bet::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:betShine .9s .3s ease-out both}
@keyframes betIn{0%{transform:translateX(-50%) scale(2.2) rotate(-8deg);opacity:0}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}@keyframes betShine{to{left:130%}}
.toast.btm.info{font:800 15px var(--body);background:#13303B;color:var(--paper);border-color:#3A6B7A}.toast.btm.bet{background:#FFF1C2;color:#7A5200}
#ovBattle .verdict{display:none}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:90;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:9px 16px;font:800 14px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;animation:tin .25s both}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

/* dig */
.digwrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#071318;flex:1 1 0;min-height:160px}
#digCv{position:absolute;inset:0;display:block;width:100%;height:100%}
#vDig .panel{flex:none}
.dighud{position:absolute;left:10px;top:10px;display:flex;gap:8px}
.dighud span{background:rgba(7,19,24,.8);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font:400 13px var(--display);color:var(--paper)}
.drill{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.drill b{font:400 18px var(--display)}
.drill .sub{font-size:12px}.kc{color:var(--gold);font-weight:800}.kq{color:var(--mint);font-weight:800}
/* scan */
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#071318;border:2px solid var(--line);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.scanbox video,.scanbox canvas.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder{position:absolute;inset:7%;pointer-events:none;opacity:.45}
.finder i{position:absolute;width:12%;height:12%;border:3px solid var(--paper);border-radius:5px}
.finder i::after{content:'';position:absolute;inset:26%;background:var(--paper);border-radius:2px}
.finder i:nth-child(1){left:0;top:0}.finder i:nth-child(2){right:0;top:0}.finder i:nth-child(3){left:0;bottom:0}
.scanline{position:absolute;left:10%;right:10%;height:3px;background:var(--mint);box-shadow:0 0 12px var(--mint);top:20%;animation:sl 2s ease-in-out infinite alternate}
@keyframes sl{to{top:78%}}
.scanidle{position:relative;text-align:center;color:var(--muted);font-size:13px;padding:20px;line-height:1.7}
.scanidle b{display:block;font:400 clamp(24px,8vw,32px)/1.35 var(--display);color:var(--paper);margin-bottom:12px;text-shadow:0 3px 0 rgba(0,0,0,.35)}.scanbox:has(.scanidle:not([hidden])) .finder{opacity:.12}.scanidle{z-index:1}.scanidle b em{font-style:normal;color:var(--mint)}
.scanbtns{display:grid;grid-template-columns:1fr;gap:10px}
.scanbtns .wide{grid-column:1/-1}
.costlbl{display:flex;align-items:center;gap:5px;font:700 12px var(--body);color:var(--muted)}.costlbl .ci{width:15px;height:15px;border-radius:4px}
.cost{display:flex;align-items:center;justify-content:center;gap:6px;font:800 13px var(--body);color:var(--mint)}
/* monster cards */
.mgrid{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcard{position:relative;background:var(--paper);color:var(--paper-ink);border:0;border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;box-shadow:0 3px 0 #9C978A}
.mcard canvas{width:84px;height:84px;max-width:100%}
.mcard .nm{font:800 12px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mcard .st{font-size:10px;color:#C08A12;letter-spacing:-.05em}
.tovisit{position:absolute;right:14px;bottom:12px;z-index:5;width:64px;height:64px;border-radius:50%;border:3px solid #FFF6D8;background:linear-gradient(180deg,#3F7A55,#1C3F2B);color:#FFF6D8;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 4px 0 #0E2418,0 6px 16px rgba(0,0,0,.4);cursor:pointer;animation:pop .25s both}
.tovisit canvas{width:30px;height:30px}.tovisit span{font:800 9px var(--body);letter-spacing:-.02em}
.tovisit i{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#E8456B;border:2px solid #FFF6D8;animation:tvp 1.2s infinite}@keyframes tvp{50%{transform:scale(1.2)}}
.tovisit:active{transform:translateY(2px)}
.visit{flex:none;margin-top:6px;border-radius:18px;padding:14px;background:linear-gradient(180deg,#2B5D3E,#1C3F2B);border:2px solid #3F7A55;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;position:relative;overflow:hidden}
.visit .gate{grid-row:span 2;width:64px;height:64px;position:relative}
.visit h4{margin:0;font:400 17px var(--display);color:#FFF6D8}.visit p{margin:0;font-size:12px;color:#CFE8D6}.visit .btn{grid-column:1/-1}
.visit .grass{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#3F7A55 0 6px,transparent 6px 12px);opacity:.6;pointer-events:none}
.arrive{position:relative;height:200px;width:100%;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,#BFE6F5,#E8F6EC 60%,#8CC98F 61%,#6FB474)}
.reveal .arrive canvas{position:absolute;bottom:12px;left:50%;width:130px!important;height:130px!important;margin-left:-65px}
.arrive .fence{position:absolute;left:0;right:0;bottom:46px;height:22px;background:repeating-linear-gradient(90deg,#B98A52 0 6px,transparent 6px 26px),linear-gradient(#B98A52,#B98A52) 0 6px/100% 4px no-repeat;opacity:.8}
.mcard .st em{font:400 11px var(--display);color:#6B6680;font-style:normal;margin-left:4px;letter-spacing:0}
.mcard .fvb,.mcard .ptb{position:absolute;top:4px;width:26px;height:26px;border-radius:50%;padding:0;cursor:pointer;font:800 15px/1 var(--body);display:grid;place-items:center}
.mcard .fvb{left:4px;border:0;background:transparent;color:#B9B2A0;font-size:19px}.mcard .fvb.on{color:#E8456B}
.mcard .ptb{right:4px;border:2px solid var(--paper-ink);background:#fff;color:var(--paper-ink);box-shadow:0 2px 0 #9C978A}.mcard .ptb.on{background:var(--coral);font:400 14px/1 var(--display)}
.ptk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--paper-ink);font-size:12px}.fvk{color:#E8456B}
.mcard .pt{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--coral);color:var(--paper-ink);font:400 12px/20px var(--display);text-align:center}
.mcard.r5{background:linear-gradient(160deg,#FFF6D8,#F4E3FF 50%,#D9F4FF)}
.mcard.r4{background:linear-gradient(160deg,#F7ECFF,var(--paper))}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pslot{border:2px dashed var(--line);border-radius:14px;min-height:118px;display:grid;place-items:center;color:var(--muted);font-size:12px;background:rgba(19,48,59,.5)}
.pslot .mcard{width:100%;height:100%}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.net{cursor:pointer;color:var(--mint);border-color:var(--mint)}.chip.net.off{color:var(--muted);border-color:var(--line)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font:800 11px var(--body);color:var(--muted)}
/* overlays */
.ov{position:absolute;inset:0;z-index:50;background:rgba(5,14,18,.82);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:pop .3s both}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.sheet h3{margin:0;font:400 22px var(--display)}
.sheet .sub{color:#5E5A72}
.sheet input[type=text]{font:800 18px var(--body);padding:10px 12px;border-radius:12px;border:3px solid var(--paper-ink);background:#fff;color:var(--paper-ink);width:100%;box-sizing:border-box}
.sheet .cost{color:#1F8F5A}
.sheet .btn.ghost{background:#E6E1D3;color:var(--paper-ink);border-color:#CFC8B6;box-shadow:0 4px 0 #B9B2A0}
.mdet{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center}
.mdet canvas{width:140px;height:140px;background:radial-gradient(circle,#fff 30%,#E8E3D6 75%);border-radius:16px}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.stat .bar{height:8px;border-radius:4px;background:#E2DCCD;overflow:hidden}.stat .bar i{display:block;height:100%;background:var(--coral)}
.stat b{font:400 13px var(--display);font-variant-numeric:tabular-nums}
.trait{background:#1D1A33;color:var(--paper);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.5}.trait b{color:var(--gold)}
.origin{font-size:11px;color:#6B6680;word-break:break-all}
.qrb{display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px;width:28px;height:28px;border-radius:8px;border:2px solid var(--paper-ink);background:#fff;padding:0;cursor:pointer;box-shadow:0 2px 0 #9C978A}.qrb .ci{width:18px;height:18px;border-radius:4px}.qrb:active{transform:translateY(2px);box-shadow:none}
.qrbig{display:grid;place-items:center}.qrbig canvas{width:min(78vw,280px);height:auto;image-rendering:pixelated;border-radius:8px;border:2px solid #E0D9C6}
/* summon reveal */
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.reveal canvas{width:220px;height:220px;max-width:100%}
.sumstage{position:relative;width:220px;height:220px;max-width:100%;display:grid;place-items:center}
.sumstage>canvas{position:relative;z-index:1}
.sumstage .rays{position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,61,.35) 0 10deg,transparent 10deg 30deg);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%)}
.sumstage.r1 .rays,.sumstage.r2 .rays{opacity:.45}
.sumstage.r4 .rays{background:repeating-conic-gradient(rgba(194,123,255,.5) 0 10deg,transparent 10deg 30deg)}
.sumstage.r5 .rays{background:repeating-conic-gradient(#FF7FA8 0 8deg,#FFC83D 8deg 16deg,#5ED6B0 16deg 24deg,#6CB8FF 24deg 32deg,transparent 32deg 45deg);opacity:.7}
.sumstage.pop>canvas{animation:mpop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes mpop{from{transform:scale(.3);opacity:0}}
.sumstage.charge>canvas{animation:shk .08s infinite alternate;filter:drop-shadow(0 0 10px #FFC83D) drop-shadow(0 0 22px #FF7A59)}
@keyframes shk{from{transform:translateX(-3px) scale(1.02)}to{transform:translateX(3px) scale(1.06)}}
.sflash{position:absolute;inset:-60px;z-index:3;background:radial-gradient(circle,#fff 30%,rgba(255,255,255,0) 70%);animation:fl .5s both;pointer-events:none}
@keyframes fl{from{opacity:0;transform:scale(.4)}40%{opacity:1}to{opacity:0;transform:scale(1.6)}}
.ccost{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;border-top:2px dashed #CFC8B6;border-bottom:2px dashed #CFC8B6;padding:10px 4px;color:var(--paper-ink)}
.ccost .lb{font:800 13px var(--body);color:#5E5A72}.ccost .vl{display:flex;align-items:center;gap:6px;justify-self:end}.ccost .vl b{font:400 24px var(--display);color:#1F8F5A}.ccost .have{grid-column:1/-1;font-size:12px;color:#5E5A72;text-align:right}.ccost .have.ng{color:#C0304A;font-weight:800}
.flyc{position:absolute;z-index:95;pointer-events:none;width:22px;height:22px}
.reveal .rar{font-size:22px;color:#C08A12;letter-spacing:.1em}
.reveal .tag{font:400 13px var(--display);background:var(--coral);color:var(--paper-ink);border-radius:8px;padding:2px 10px}
/* battle */
#ovBattle{padding:0;align-items:stretch;background:var(--ink)}
.bt{display:flex;flex-direction:column;width:100%;height:100%;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box;gap:8px;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:14px 14px}
.side{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 10px}
.side.op{border-color:#6A2E3E}.side.me{border-color:#1F6B5A}
.side canvas.act{width:92px;height:92px}
.sinfo{min-width:0;display:flex;flex-direction:column;gap:4px}
.sname{display:flex;gap:8px;align-items:baseline;min-width:0}.sname b{font:800 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sname small{color:var(--muted);font-size:11px;white-space:nowrap}
.hp{height:10px;border-radius:5px;background:#071318;overflow:hidden;border:1px solid var(--line)}.hp i{display:block;height:100%;background:var(--mint);transition:width .4s}
.side.op .hp i{background:var(--rose)}
.team{display:flex;gap:4px}.team span{flex:1;height:5px;border-radius:3px;background:var(--mint)}.side.op .team span{background:var(--rose)}.team span.ko{background:#2A3A40}
.hpn{font:400 12px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.arena{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.seti{font:400 13px var(--display);color:var(--muted);text-align:center;margin:2px 0 0;flex:none;white-space:nowrap}.seti b{color:var(--gold)}
.clash{display:flex;gap:26px;align-items:center}
.card{width:74px;height:104px;border-radius:12px;position:relative;perspective:600px}

  <div class="optrow"><label>オンライン対戦</label><div class="seg" id="segN"><button data-v="1" class="${save.opt.online!==false?'on':''}">ON</button><button data-v="0" class="${save.opt.online===false?'on':''}">オフライン</button></div></div>
  <div class="optrow"><label>カードを選べる時間</label><div class="seg" id="segP">${[[3,'3秒'],[5,'5秒'],[0,'全部オート']].map(([v,l])=>`<button data-v="${v}" class="${pk===v?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="optrow"><label>バージョン情報</label><div class="vlist"><div class="vblk cur"><div class="vh"><b>Ver0.4</b><span>いまのバージョン</span></div><ul class="vnote"><li>バトル：モンスターがたおれたら、おたがい手札5枚からやり直し（セット数はそのまま）</li><li>オプションに効果音とBGMの音量調整を追加</li><li>召喚したモンスターのくわしい画面で、読みこんだURLの後ろのQRボタンからQRコードを表示できる</li><li>牧場のモンスターが増えると右下に「おきゃくさん」ボタン</li><li>牧場のいちばん下に「きょうのおきゃくさん」：1日1回むりょうでモンスターが牧場にやってくる</li><li>牧場：上のパーティ列をなくし、各モンスターの右上の＋でパーティに出し入れ。♡でお気に入りにすると上にならぶ</li><li>くわしい画面でQRポイントを使ってLvを上げられる（1→2は10,000、2→3は20,000…。「わかれる」はなくした）</li><li>プレイヤーレベルを追加（バトルで経験値）。レベルが低いうちはCPUが弱め、負けが続くとさらにやさしく</li><li>バトル：自分の手札を暗くしない／勝負が終わったカードはすぐ片づく／メッセージを見やすく</li><li>バトルBGMを追加（オプションでOFFにできる）</li><li>召喚の確認画面のQRポイント表示を見やすく</li></ul></div><div class="vblk"><div class="vh"><b>Ver0.3</b></div><ul class="vnote"><li>お金を2つに分けた：コイン（ふつうのブロック・ドリル強化用）とQRポイント（QRブロックやバトル・召喚とBET用）</li><li>はじめて遊ぶときにコイン1,000とQRポイント10,000をプレゼント</li><li>読み込めるのは http〜 で始まるQRコードだけに</li><li>発掘とバトルの説明を？ボタンにまとめた</li><li>ブロックを壊すとコインやQRポイントが飛んでいく演出</li></ul></div><div class="vblk"><div class="vh"><b>Ver0.2</b></div><ul class="vnote"><li>オンライン対戦：近くのバトラーと自動でマッチ。見つからなければCPUと対戦</li><li>オフラインモード：オプションかバトル画面のボタンで切り替え</li></ul></div><div class="vblk"><div class="vh"><b>Ver0.1</b></div><ul class="vnote"><li>QRコードからモンスターを召喚（同じQRなら同じモンスター）。同じドメインからは1回だけ</li><li>発掘：ドリルが自動で掘る。閉じている間も半分のペース（最大48時間）</li><li>バトル：キング・ナイト・ジョーカーのカードバトル（全4セット）。ふだんはオート、時間内にタップで自分で選べる</li><li>勝つと相手のモンスターを1体コピー</li><li>プレイヤー名は左上をタップしていつでも変えられる</li></ul></div></div></div>`;
  el.querySelectorAll('#segS button').forEach(b=>b.onclick=()=>{save.opt.sound=b.dataset.v==='1';if(!save.opt.sound)bgmStop();persist();SFX.tap();openOpt()});
  el.querySelectorAll('.volr').forEach(r=>{const k=r.dataset.k,upd=()=>{const v=volOf(k);r.querySelectorAll('.vm i').forEach((x,i)=>x.classList.toggle('on',i<v));r.querySelector('.vn').textContent=v?v:'消音';bgmVol();if(k==='bvol')bgmPreview()};
    r.querySelector('.vdn').onclick=()=>{save.opt[k]=Math.max(0,volOf(k)-1);persist();upd();if(k==='vol')SFX.tap()};r.querySelector('.vup').onclick=()=>{save.opt[k]=Math.min(10,volOf(k)+1);persist();upd();if(k==='vol')SFX.tap()};
    r.querySelectorAll('.vm i').forEach((x,i)=>x.onclick=()=>{save.opt[k]=i+1;persist();upd();if(k==='vol')SFX.tap()})});
  el.querySelectorAll('#segB button').forEach(b=>b.onclick=()=>{save.opt.bgm=b.dataset.v==='1';persist();SFX.tap();openOpt()});
  el.querySelectorAll('#segN button').forEach(b=>b.onclick=()=>{save.opt.online=b.dataset.v==='1';persist();SFX.tap();openOpt();renderBattleLobby()});
  el.querySelectorAll('#segP button').forEach(b=>b.onclick=()=>{save.opt.pick=+b.dataset.v;persist();SFX.tap();openOpt()});
  $('#bOptX').onclick=()=>{$('#ovOpt').hidden=true;bgmPreviewEnd()};$('#ovOpt').hidden=false}
$('#bOpt').onclick=()=>{SFX.tap();openOpt()};

/* ---------- main loop ---------- */
let lastT=performance.now(),saveT=0,bgAcc=0;
function frame(now){const dt=Math.min(100,now-lastT);lastT=now;
  if(curView==='vDig'&&!document.hidden){digUpdate(dt);digRender()}
  else{bgAcc+=dt;if(bgAcc>=1000){const s=Math.floor(bgAcc/1000);bgAcc-=s*1000;save.gold=(save.gold||0)+rateOf(save.dig.lv)*.5*s;save.coins+=qpRateOf(save.dig.lv)*.5*s;updCoins()}}
  saveT+=dt;if(saveT>4000){saveT=0;save.dig.last=Date.now();persist()}
  requestAnimationFrame(frame)}
addEventListener('resize',()=>{if(curView==='vDig')digResize()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save.dig.last=Date.now();persist()}else offline()});
addEventListener('pagehide',()=>{save.dig.last=Date.now();persist()});
if(/[?&]dbg=1/.test(location.search)){$('#bTxt').hidden=false;$('.scanbtns').style.gridTemplateColumns='1fr 1fr'}
if(/[?&]dbg=1/.test(location.search))window.__qb={get save(){return save},get BT(){return BT},get BGM(){return BGM},genMon,addMon,onQR,persist,shuffleHand,NET,spawnCoins,gain};
/* boot */
$('#pName').textContent=save.name||'-';D.row=Math.max(0,save.dig.depth|0);D.cam=D.row-2;if(cell(D.row,D.col))clearCell(D.row,D.col);
digResize();updCoins();drawIcons();offline();
if(!save.name)openName(true);
mpLog('[boot] Ver'+VER,'オンライン設定:',save.opt.online!==false?'ON':'OFF（オフライン）','サーバー:',MP_URL);
requestAnimationFrame(frame);
})();
</script>
</body></html>
